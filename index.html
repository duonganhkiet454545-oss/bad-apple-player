
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bad Apple Binary Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #111;
    color: white;
    font-family: monospace;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    margin-bottom: 20px;
}

#output {
    width: 100%;
    max-width: 1100px;
    min-height: 350px;
    margin: 20px auto;
    overflow: auto;
    background: black;
    border: 2px solid white;
    padding: 15px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

#binary {
    display: inline-block;
    width: max-content;
    white-space: pre;
    font-family: monospace;
    font-size: 9px;
    line-height: 9px;
    letter-spacing: 1px;
    font-weight: bold;
    color: white;
    transform: scaleX(1.35);
    transform-origin: top center;
}

.controls {
    margin: 15px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    max-width: 1000px;
}

button, select {
    padding: 9px 15px;
    background: #333;
    color: white;
    border: 1px solid white;
    cursor: pointer;
}

button:hover {
    background: #555;
}

label {
    display: flex;
    gap: 5px;
    align-items: center;
}

video, canvas {
    display: none;
}

#status {
    color: #aaa;
    margin-top: 12px;
}
</style>
</head>

<body>

<h1>BAD APPLE!! BINARY</h1>

<div id="output">
    <pre id="binary">VIDEO NOT LOADED</pre>
</div>

<div class="controls">
    <button id="playBtn">Play</button>
    <button id="pauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>

    <label>
        FPS
        <select id="fps">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="30">30</option>
        </select>
    </label>

    <label>
        Speed
        <select id="speed">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
        </select>
    </label>

    <label>
        Volume
        <input id="volume" type="range"
               min="0" max="1" step="0.05" value="1">
    </label>
</div>

<p id="status">Loading video...</p>

<video id="video" playsinline preload="auto"
       crossorigin="anonymous"></video>

<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    willReadFrequently: true
});

const binary = document.getElementById("binary");
const status = document.getElementById("status");

const cols = 96;
const rows = 72;

canvas.width = cols;
canvas.height = rows;

// VIDEO SOURCE
const VIDEO_URL =
"https://raw.githubusercontent.com/duonganhkiet454545-oss/bad-apple-player/main/bad-apple.mp4";

video.src = VIDEO_URL;

let playing = false;
let animationId = null;
let lastFrameTime = 0;

function convertFrame() {
    if (video.readyState < 2) return;

    ctx.drawImage(video, 0, 0, cols, rows);

    const image = ctx.getImageData(
        0, 0, cols, rows
    ).data;

    let result = "";

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const index = (y * cols + x) * 4;

            const r = image[index];
            const g = image[index + 1];
            const b = image[index + 2];

            const brightness =
                0.299 * r + 0.587 * g + 0.114 * b;

            result += brightness > 128 ? "0" : "1";
        }

        result += "\n";
    }

    binary.textContent = result;
}

function renderFrame(timestamp) {
    if (!playing) return;

    const fps = Number(
        document.getElementById("fps").value
    );

    const interval = 1000 / fps;

    if (timestamp - lastFrameTime >= interval) {
        convertFrame();
        lastFrameTime = timestamp;
    }

    animationId = requestAnimationFrame(renderFrame);
}

video.addEventListener("loadeddata", () => {
    status.textContent = "Video loaded!";
    convertFrame();
});

video.addEventListener("ended", () => {
    playing = false;
    cancelAnimationFrame(animationId);
    status.textContent = "Video ended.";
});

video.addEventListener("error", () => {
    status.textContent =
        "Cannot load video. Check URL or CORS settings.";
});

document.getElementById("playBtn").onclick = async () => {
    if (video.readyState < 2) {
        status.textContent = "VIDEO IS LOADING...";
        return;
    }

    try {
        await video.play();

        playing = true;
        status.textContent = "Playing...";

        cancelAnimationFrame(animationId);

        lastFrameTime = 0;
        animationId = requestAnimationFrame(renderFrame);

    } catch (error) {
        status.textContent = "Cannot play video.";
    }
};

document.getElementById("pauseBtn").onclick = () => {
    video.pause();
    playing = false;
    cancelAnimationFrame(animationId);
    status.textContent = "Paused.";
};

document.getElementById("restartBtn").onclick = () => {
    video.pause();
    playing = false;
    cancelAnimationFrame(animationId);

    video.currentTime = 0;
    convertFrame();

    status.textContent = "Restarted.";
};

document.getElementById("speed").onchange = (event) => {
    video.playbackRate = Number(event.target.value);
};

document.getElementById("volume").oninput = (event) => {
    video.volume = Number(event.target.value);
};
</script>

</body>
</html>
